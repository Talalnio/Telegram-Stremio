# Blueprint for the "Deploy to Render" button in README.md.
services:
  - type: web
    name: telegram-stremio
    runtime: docker
    plan: free
    autoDeployTrigger: "off" # each deploy is the user's own copy; they update from the app's Settings
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DATABASE
        sync: false
